<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Schlagwortfilter – Testseite</title>
  <style>
    body { font-family: sans-serif; margin: 0; }
    header { background: #222; color: #fff; padding: 8px 16px; }
    header ul { display: flex; gap: 16px; list-style: none; margin: 0; padding: 0; }
    main { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; padding: 16px; max-width: 900px; }
    article, figure { border: 1px solid #ccc; padding: 8px; margin: 0; }
    img { display: block; }
    a { color: inherit; text-decoration: none; }
  </style>
</head>
<body>
  <header><nav><ul><li><a href="#">Start</a></li><li><a href="#">Politik</a></li><li><a href="#">Sport</a></li></ul></nav></header>
  <main id="main">
    <section id="col">
      <article id="t-text"><h2>FUSSBALL: Derby endet unentschieden</h2><p>Ein spannender Abend im Stadion.</p></article>
      <article id="t-neutral"><h2>Neue Radwege in der Stadt</h2><p>Die Stadt baut weiter aus.</p></article>
      <figure id="t-alt">
        <img id="img-alt" src="{{IMG}}/alt-bild.png" alt="Hochwasser in der Steiermark" width="320" height="180">
        <figcaption>Foto: Archiv</figcaption>
      </figure>
      <article id="t-ocr"><a href="#"><img id="img-ocr" src="{{IMG}}/ocr-treffer.png" alt="Symbolbild" width="320" height="180"><h3>Aktuelle Meldung</h3></a></article>
    </section>
    <section id="col2">
      <article id="t-control"><img id="img-control" src="{{IMG}}/ocr-kontrolle.png" alt="" width="320" height="180"><h3>Wetter</h3></article>
      <article id="t-lazy"><img id="img-lazy" data-src="{{IMG}}/ocr-nachgeladen.png" width="320" height="180" alt=""><h3>Lokales</h3></article>
      <article id="t-icon"><img id="img-icon" src="{{IMG}}/ocr-treffer.png" width="32" height="18" alt=""><h3>Kleines Symbol</h3></article>
      <article id="t-teaser"><img id="img-teaser" src="{{IMG}}/ocr-kontrolle.png?teaser" alt="" width="320" height="180"><h3>Fußball: Rekordtransfer fix</h3></article>
      <div id="later"></div>
    </section>
  </main>
  <script>
    // Nachgeladener Inhalt (wie lazy loading / Endlos-Scrollen)
    setTimeout(() => {
      const img = document.getElementById('img-lazy');
      img.src = img.dataset.src;
      document.getElementById('later').innerHTML =
        '<article id="t-later"><h2>Lawine verschüttet Straße</h2><p>Einsatzkräfte vor Ort.</p></article>' +
        '<article id="t-later-ok"><h2>Konzert im Park</h2><p>Eintritt frei.</p></article>';
    }, 1500);
  </script>
</body>
</html>
